schema_version: ylx.governance-negative-cases.v1
cases:
  - id: g0-signed-decision-removed
    mutation:
      target: policy
      path: [policy_ratification, proposal_extension_reconciliation, required_g0_signed_decision]
      operation: remove
    expected_error_contains: "policy.policy_ratification.proposal_extension_reconciliation: required G0 signed decision must be exact and closed"

  - id: g0-signed-decision-type-tampered
    mutation:
      target: policy
      path: [policy_ratification, proposal_extension_reconciliation, required_g0_signed_decision, decision]
      operation: replace
      value: RATIFY_THREE_FIELD_ONLY
    expected_error_contains: "policy.policy_ratification.proposal_extension_reconciliation: required G0 signed decision must be exact and closed"

  - id: g0-signed-decision-allows-implicit-union
    mutation:
      target: policy
      path: [policy_ratification, proposal_extension_reconciliation, required_g0_signed_decision, implicit_union]
      operation: replace
      value: ALLOWED
    expected_error_contains: "policy.policy_ratification.proposal_extension_reconciliation: required G0 signed decision must be exact and closed"

  - id: g0-signed-decision-payload-binding-tampered
    mutation:
      target: policy
      path: [policy_ratification, proposal_extension_reconciliation, required_g0_signed_decision, payload_ref_binding, artifact_sha256_equals]
      operation: replace
      value: payload_ref.artifact_sha256
